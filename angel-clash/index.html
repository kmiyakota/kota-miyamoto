<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ANGEL CLASH</title><style>*{box-sizing:border-box}body{margin:0;background:#171025;color:white;font:16px system-ui;overflow:hidden;touch-action:none}#c{width:100vw;height:100dvh;display:block}#menu{position:absolute;inset:0;background:#16132cde;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:13px}button{background:#503c8a;color:white;border:2px solid #e8a9ff;border-radius:10px;padding:12px 18px;font-weight:bold}#buttons{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 3%;pointer-events:none}#buttons section{display:grid;grid-template-columns:repeat(3,44px);gap:4px;pointer-events:auto}#buttons button{padding:9px 0;touch-action:none;opacity:.8;font-size:12px}#buttons .dir{background:#39455f}#buttons .atk{background:#9b3c7a}small{opacity:.8}#status{position:absolute;top:0;left:0;right:0;text-align:center;font-size:11px;pointer-events:none}</style><canvas id="c"></canvas><div id="menu"><h1 style="color:#ffd0ff;font-size:clamp(30px,8vw,64px);margin:0;text-shadow:3px 4px #8b3c99">ANGEL CLASH</h1><div>キャラクターを選択</div><div><button onclick="start(0)">ITO 🌸</button> <button onclick="start(1)">AKARI 🪽</button> <button onclick="start(2)">TAMAKI 💜</button></div><small>PC: A/D 移動 W ジャンプ S しゃがみ J/K/L パンチ U/I/O キック<br>スマートフォン: 画面下の方向・攻撃ボタン</small></div><div id="buttons"><section><button class="dir" data-key="a">◀</button><button class="dir" data-key="w">▲</button><button class="dir" data-key="d">▶</button><button class="dir" data-key="s">▼</button></section><section><button class="atk" data-key="j">LP</button><button class="atk" data-key="k">MP</button><button class="atk" data-key="l">HP</button><button class="atk" data-key="u">LK</button><button class="atk" data-key="i">MK</button><button class="atk" data-key="o">HK</button></section></div><div id="status">Ver. 0.3 WEB PLAYABLE — 画像アニメーション差し替え前の暫定公開版</div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),menu=document.querySelector('#menu');let W=960,H=540,playing=false,last=0,frame=0,timer=99,round=1,win=0,loss=0,freeze=0;const keys={},pressed={};const names=['ITO','AKARI','TAMAKI'],colors=['#f38cbd','#87baff','#8563ba'],hair=['#f9c44b','#51303a','#473067'];let p,e,particles=[];function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=Math.floor(innerWidth*d);c.height=Math.floor(innerHeight*d);g.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();function input(k,v){if(v&&!keys[k])pressed[k]=true;keys[k]=v}addEventListener('keydown',ev=>{let k=ev.key.toLowerCase();if('adwsjk luio'.includes(k)){ev.preventDefault();input(k,true)}});addEventListener('keyup',ev=>input(ev.key.toLowerCase(),false));document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',ev=>{ev.preventDefault();b.setPointerCapture(ev.pointerId);input(b.dataset.key,true)});for(let t of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(t,()=>input(b.dataset.key,false))});function fighter(id,x,face){return{id,x,y:0,vy:0,face,hp:1000,attack:0,active:0,stun:0,guard:0,pose:0,cool:0,hit:false}}function start(id){p=fighter(id,240,1);e=fighter((id+1)%3,720,-1);playing=true;menu.style.display='none';round=1;win=loss=0;timer=99;frame=0;freeze=0}function reset(){p=fighter(p.id,240,1);e=fighter(e.id,720,-1);timer=99;freeze=70}function attack(f,power,kick=false){if(f.attack||f.stun||f.cool)return;f.attack=kick?28:23;f.active=power;f.hit=false;f.pose=kick?2:1;f.cool=5}function spawn(x,y,col,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,life:20,col})}function logic(){if(!playing)return;frame++;if(freeze){freeze--;return}if(frame%60===0)timer--;for(let f of [p,e]){f.face=f===p?(e.x>=p.x?1:-1):(p.x>=e.x?1:-1);if(f.stun)f.stun--;if(f.cool)f.cool--;if(f.attack)f.attack--;if(f.y<0||f.vy<0){f.vy+=.72;f.y+=f.vy;if(f.y>0){f.y=0;f.vy=0}}}if(!p.stun){let dx=(keys.d?1:0)-(keys.a?1:0);p.guard=dx*p.face<0&&p.y===0;p.x+=dx*(p.attack?1.1:4.1);if(pressed.w&&p.y===0){p.vy=-13;p.y=-1}if(keys.s&&p.y===0)p.pose=3;else if(!p.attack)p.pose=0;for(let [k,n] of [['j',1],['k',2],['l',3],['u',1],['i',2],['o',3]])if(pressed[k])attack(p,n,'uio'.includes(k))}if(!e.stun){let dist=Math.abs(e.x-p.x);e.guard=p.attack>6&&dist<125&&Math.random()<.1;if(!e.attack&&frame%18===0){if(dist>115)e.x+=e.face*3.4*8;else if(Math.random()<.65)attack(e,1+Math.floor(Math.random()*3),Math.random()<.5)}}for(let f of [p,e]){let target=f===p?e:p;if(f.attack===12&&!f.hit&&Math.abs(f.x-target.x)<(f.pose===2?140:120)&&Math.abs(f.y-target.y)<80){f.hit=true;let dmg=f.active*48;if(target.guard)dmg=Math.ceil(dmg*.1);target.hp=Math.max(0,target.hp-dmg);target.stun=target.guard?8:16;target.x+=f.face*(target.guard?9:25);spawn(target.x,target.y-110,colors[f.id],12);freeze=4}}p.x=Math.max(65,Math.min(895,p.x));e.x=Math.max(65,Math.min(895,e.x));if(Math.abs(p.x-e.x)<65){let mid=(p.x+e.x)/2;p.x=mid-32.5*p.face;e.x=mid+32.5*p.face}particles=particles.filter(a=>a.life-->0);for(let a of particles){a.x+=a.vx;a.y+=a.vy;a.vy+=.3}for(let k in pressed)delete pressed[k];if(timer<=0||p.hp<=0||e.hp<=0){let result=p.hp>e.hp?1:p.hp<e.hp?-1:0;if(result===1)win++;if(result===-1)loss++;if(win===2||loss===2){playing=false;menu.style.display='flex';menu.querySelector('h1').textContent=win===2?'YOU WIN!':'GAME OVER';menu.querySelector('div').textContent='もう一度プレイするキャラクターを選択';}else{round++;reset()}}}function drawF(f){g.save();g.translate(f.x,445+f.y);g.scale(f.face,1);let bob=f.attack?0:Math.sin(frame*.12)*3;g.translate(0,bob);g.fillStyle='#14132688';g.beginPath();g.ellipse(0,3,45,9,0,0,7);g.fill();let col=colors[f.id];g.fillStyle=f.id===2?'#40314e':'#f9f4fa';g.fillRect(-20,-54,15,55);g.fillRect(7,-54,15,55);g.fillStyle=col;g.fillRect(-23,-13,18,8);g.fillRect(6,-13,18,8);g.fillStyle=hair[f.id];g.beginPath();g.ellipse(0,-144,f.id===0?37:34,42,0,0,7);g.fill();if(f.id===0){g.fillStyle='#e84799';g.beginPath();g.ellipse(-30,-174,22,15,-.4,0,7);g.ellipse(-14,-179,19,15,.4,0,7);g.fill()}if(f.id===1||f.id===2){g.fillStyle=f.id===1?'#f3f5ff':'#302044';for(let side of [-1,1]){g.beginPath();g.moveTo(side*20,-115);g.quadraticCurveTo(side*83,-185,side*74,-95);g.quadraticCurveTo(side*55,-112,side*20,-98);g.fill()}}g.fillStyle=col;g.beginPath();g.moveTo(-26,-118);g.lineTo(27,-118);g.lineTo(36,-58);g.lineTo(-37,-58);g.closePath();g.fill();g.fillStyle='#f8d0b5';g.fillRect(-14,-135,28,25);g.beginPath();g.ellipse(0,-154,25,30,0,0,7);g.fill();g.fillStyle=hair[f.id];g.beginPath();g.ellipse(-2,-174,27,18,0,Math.PI,Math.PI*2);g.fill();if(f.id===0){g.strokeStyle='#f8c54e';g.lineWidth=10;g.beginPath();g.moveTo(-25,-167);g.bezierCurveTo(-55,-110,-55,-65,-35,-50);g.stroke()}g.fillStyle='#312038';g.fillRect(7,-158,4,5);if(f.id===2){g.strokeStyle='#f4e6ff';g.lineWidth=2;g.beginPath();g.arc(10,-155,11,0,7);g.arc(-13,-155,11,0,7);g.moveTo(-2,-155);g.lineTo(0,-155);g.stroke()}g.strokeStyle='#f9d7c7';g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(18,-105);if(f.pose===1){g.lineTo(80,-112)}else if(f.pose===2){g.lineTo(44,-95)}else g.lineTo(35,-80);g.moveTo(-18,-105);g.lineTo(-34,-79);g.stroke();if(f.pose===2){g.strokeStyle=f.id===2?'#40314e':'#f9f4fa';g.lineWidth=17;g.beginPath();g.moveTo(10,-45);g.lineTo(102,-100);g.stroke()}if(f.attack>10&&f.attack<19){g.strokeStyle=col;g.lineWidth=5;g.beginPath();g.arc(f.pose===2?102:82,-110,22,-1,1);g.stroke()}g.restore()}function render(){g.clearRect(0,0,W,H);let grad=g.createLinearGradient(0,0,0,500);grad.addColorStop(0,'#47386d');grad.addColorStop(.7,'#db8aa6');grad.addColorStop(1,'#ffd6af');g.fillStyle=grad;g.fillRect(0,0,W,H);g.fillStyle='#fff4';for(let i=0;i<30;i++){let x=(i*157+frame*.4)%960,y=(i*71)%320;g.fillRect(x,y,4,4)}g.fillStyle='#493b65';for(let i=0;i<15;i++){let x=i*74-30;g.fillRect(x,240-(i%4)*19,65,205)}g.fillStyle='#94748d';g.fillRect(0,445,960,95);g.strokeStyle='#c4a6af';for(let y=455;y<540;y+=25){g.beginPath();g.moveTo(0,y);g.lineTo(960,y);g.stroke()}for(let x=0;x<960;x+=90){g.beginPath();g.moveTo(x,445);g.lineTo(x-55,540);g.stroke()}if(p&&e){drawF(p);drawF(e);g.fillStyle='#191326';g.fillRect(35,28,386,34);g.fillRect(539,28,386,34);g.fillStyle='#f4bd59';g.fillRect(39,32,378*p.hp/1000,26);g.fillStyle='#f4bd59';g.fillRect(543+378*(1-e.hp/1000),32,378*e.hp/1000,26);g.fillStyle='#fff';g.font='bold 26px system-ui';g.textAlign='left';g.fillText(names[p.id]+'  '+win+' WIN',38,91);g.textAlign='right';g.fillText(names[e.id]+'  '+loss+' WIN',924,91);g.textAlign='center';g.font='bold 47px system-ui';g.fillStyle='#fff3a2';g.fillText(Math.max(0,timer),480,69);g.font='bold 18px system-ui';g.fillText('ROUND '+round,480,94)}for(let a of particles){g.globalAlpha=a.life/20;g.fillStyle=a.col;g.fillRect(a.x,a.y,8,8)}g.globalAlpha=1}let acc=0;function loop(t){let dt=Math.min(100,t-last||16);last=t;acc+=dt;let n=0;while(acc>=1000/60&&n++<5){logic();acc-=1000/60}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script><script src="./characters.js"></script></html>
