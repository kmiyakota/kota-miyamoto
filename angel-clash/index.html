function drawCombatAuras(visualFighters){
 for(const f of visualFighters){
  if(!hasAttack(f)||!['pulse','riser','rush','super'].includes(f.moveName))continue;
  const isSuper=f.moveName==='super',cx=f.x,cy=f.y-192;
  const intensity=clamp((f.moveFrame+1)/9,0,1)*(isSuper?.52:.32);
  g.save();g.globalCompositeOperation='screen';g.globalAlpha=intensity;
  const radius=isSuper?240:172,gr=g.createRadialGradient(cx,cy,9,cx,cy,radius);
  gr.addColorStop(0,f.c.light+'a8');gr.addColorStop(.4,f.c.color+'55');gr.addColorStop(1,'#00000000');
  g.fillStyle=gr;g.fillRect(cx-radius,cy-radius,radius*2,radius*2);
  const rays=isSuper?14:8;
  for(let i=0;i<rays;i++){
   const angle=i*TAU/rays+displayTick*.018*(f.face||1);
   const r1=65+Math.sin(displayTick*.09+i*2)*7,r2=r1+39+(isSuper?53:0);
   g.strokeStyle=i%3===0?'#fff5e9':f.c.light;g.lineWidth=i%3===0?2.6:1.5;
   g.beginPath();g.moveTo(cx+Math.cos(angle)*r1,cy+Math.sin(angle)*r1);
   g.lineTo(cx+Math.cos(angle)*r2,cy+Math.sin(angle)*r2);g.stroke();
  }
  g.restore();
 }
}

 state:()=>({scene,modeKind,stageIndex,round,wins:[...wins],timer,score,freeze,paused,endDelay,roundFrames,maxCombo:[...maxCombo],cutIn:cutIn?{...cutIn}:null,fighters:fighters.map(f=>({id:f.id,hp:f.hp,meter:f.meter,guard:f.guard,parry:f.parry,dash:f.dash,aiPlan:f.aiPlan?.type,x:f.x,y:f.y,act:f.act,stun:f.stun,moveName:f.moveName})),projectiles:projectiles.length}),
 start:(a='ito',b='tamaki',mode='cpu')=>beginMatch(a,b,mode),
 menu:()=>setScene('menu'),pick:(a=0,b=2,mode='cpu')=>{pick=a;pickRival=b;modeKind=mode;setScene('select')},
 setHitboxes:(b)=>{debugHitbox=!!b},
 setDifficulty:(d)=>{settings.difficulty=clamp(d,0,2)},
 setTrainingDummy:(d)=>{settings.trainingDummy=clamp(d,0,2)},
 forceWin:(p=0)=>{if(scene!=='fight')return;fighters[1-p].hp=0;endDelay=1},
 setMeter:(p=0,n=100)=>{if(fighters[p])fighters[p].meter=clamp(n,0,100)},
 setHP:(p=0,n=100)=>{if(fighters[p])fighters[p].hp=clamp(n,0,fighters[p].maxHp)},
 setGuard:(p=0,n=100)=>{if(fighters[p])fighters[p].guard=clamp(n,0,100)},
 setPosition:(p=0,x=500)=>{if(fighters[p])fighters[p].x=clamp(x,75,W-75)},
 setStun:(p=0,n=20)=>{if(fighters[p])fighters[p].stun=max(0,n)},
 setParry:(p=0,n=5)=>{if(fighters[p])fighters[p].parry=max(0,n)},
 getLine:(id)=>META[id]?.intro,
 options:()=>structuredClone(settings),
 setTouchMode:(mode)=>{settings.touchMode=mode;applyTouchMode()},
 move:(p,k)=>{const f=fighters[p];if(!f)return false;return startAttack(f,k)},
 tick:(n=1)=>{for(let i=0;i<n;i++)stepLogic();renderAlpha=1;render()},
 animationState:()=>fighters.map(f=>({id:f.id,walk:f.visual?.walk??0,crouch:f.visual?.crouch??0,air:f.visual?.air??0,land:f.visual?.land??0,lean:f.visual?.lean??0,pose:f.visual?.poseTo??0,blend:f.visual?.poseBlend??1})),
 chooseMode:(i=0)=>{menuIndex=i;chooseMenu()},
 setScene:(s)=>setScene(s)
};
})();
</script></body></html>
