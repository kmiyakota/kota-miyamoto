name: Verify HORIZON RUSH live MP3 assets
on:
  push:
    branches: [queue]
    paths: ['.github/workflows/horizon-rush-live-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: queue }
      - name: Check live website MP3s
        id: check
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request, time, sys
          expected = {
              "title.mp3": "bb1cde334e191af1e0df0794b0a0d64a56e3bd9223cadc5dff951cd0310b7af3",
              "even.mp3": "8196b3039fc43145f49a883c4c5fbcaeb4d0fb801f892036c5d1510ce20ba52c",
              "boss.mp3": "c5ae3103ee37fa71027836fbde2393f5a85b62be78707ad62912a5681ee363e9",
          }
          base = "https://suki-character-kobo.pages.dev/horizon-rush/assets/music/"
          pending = dict(expected)
          for attempt in range(1, 9):
              print(f"Check attempt {attempt}; pending {list(pending)}", flush=True)
              for name, digest in list(pending.items()):
                  try:
                      url = base + name + "?v=20261103"
                      req = urllib.request.Request(url,headers={"User-Agent":"HorizonRushLiveCheck/1.0"})
                      with urllib.request.urlopen(req, timeout=25) as r:
                          actual = hashlib.sha256(r.read()).hexdigest()
                      if digest == actual:
                          print(f"LIVE VERIFIED {name}",flush=True)
                          del pending[name]
                      else:
                          print(f"NOT YET MATCHED {name}: sha256={actual}",flush=True)
                  except Exception as e:
                      print(f"NOT YET READABLE {name}: {str(e)[:200]}",flush=True)
              if not pending:
                  print("ALL THREE PUBLIC MP3S MATCH THEIR UPLOADED SOURCES", flush=True)
                  sys.exit(0)
              if attempt < 8: time.sleep(15)
          print(f"FAILED LIVE CHECK: {list(pending)}",flush=True)
          sys.exit(1)
          PY
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/horizon-rush-live-check.yml
          git commit -m "Remove temporary HORIZON RUSH live check"
          git push origin HEAD:queue
