name: Materialize manga assets

on:
  push:
    branches: [work]
    paths:
      - '.image-staging/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - name: Decode staged manga assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p otaku-talk/episodes/009-girls-last-tour
          mkdir -p otaku-talk/episodes/015-spy-family
          mkdir -p otaku-talk/episodes/017-the-last-of-us
          mkdir -p otaku-talk/episodes/026-delicious-in-dungeon
          cat .image-staging/009.part1 .image-staging/009.part2 .image-staging/009.part3 | tr -d '\r\n' | base64 -d > otaku-talk/episodes/009-girls-last-tour/manga.avif
          cat .image-staging/015.part1 .image-staging/015.part2 .image-staging/015.part3 | tr -d '\r\n' | base64 -d > otaku-talk/episodes/015-spy-family/manga.avif
          cat .image-staging/017.part1 .image-staging/017.part2 .image-staging/017.part3 | tr -d '\r\n' | base64 -d > otaku-talk/episodes/017-the-last-of-us/manga.avif
          cat .image-staging/026.part1 .image-staging/026.part2 .image-staging/026.part3 | tr -d '\r\n' | base64 -d > otaku-talk/episodes/026-delicious-in-dungeon/manga.avif
          test -s otaku-talk/episodes/009-girls-last-tour/manga.avif
          test -s otaku-talk/episodes/015-spy-family/manga.avif
          test -s otaku-talk/episodes/017-the-last-of-us/manga.avif
          test -s otaku-talk/episodes/026-delicious-in-dungeon/manga.avif
          rm -rf .image-staging
      - name: Commit decoded assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add otaku-talk/episodes/009-girls-last-tour/manga.avif otaku-talk/episodes/015-spy-family/manga.avif otaku-talk/episodes/017-the-last-of-us/manga.avif otaku-talk/episodes/026-delicious-in-dungeon/manga.avif .image-staging
          git commit -m 'Materialize repaired Otaku Talk manga assets'
          git push origin HEAD:work
