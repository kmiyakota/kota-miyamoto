name: Import HORIZON RUSH music assets
on:
  push:
    branches: [queue]
    paths: ['.github/workflows/horizon-rush-bgm-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: queue
      - name: Download and verify the three MP3s
        env:
          BOSS_URL: "https://at.adobe.com/9SSkATvKIbs44b8g"
          TITLE_URL: "https://at.adobe.com/7DUY9mw0vf13h2Ln"
          EVEN_URL: "https://at.adobe.com/0PY5mYkhNO5CS3cR"
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          dst = pathlib.Path("horizon-rush/assets/music")
          dst.mkdir(parents=True, exist_ok=True)
          files = [
              ("BOSS_URL", "boss.mp3", 4421610, "c5ae3103ee37fa71027836fbde2393f5a85b62be78707ad62912a5681ee363e9"),
              ("TITLE_URL", "title.mp3", 4100869, "bb1cde334e191af1e0df0794b0a0d64a56e3bd9223cadc5dff951cd0310b7af3"),
              ("EVEN_URL", "even.mp3", 2047750, "8196b3039fc43145f49a883c4c5fbcaeb4d0fb801f892036c5d1510ce20ba52c"),
          ]
          for variable, filename, expected_size, expected_sha256 in files:
              request = urllib.request.Request(os.environ[variable], headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=120) as response:
                  contents = response.read()
              digest = hashlib.sha256(contents).hexdigest()
              if len(contents) != expected_size or digest != expected_sha256:
                  raise RuntimeError(f"Bad asset {filename}: bytes={len(contents)}, sha256={digest}")
              (dst / filename).write_bytes(contents)
              print(f"Verified {filename}: {len(contents)} bytes")
          PY
      - name: Commit verified BGM assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horizon-rush/assets/music/title.mp3 horizon-rush/assets/music/even.mp3 horizon-rush/assets/music/boss.mp3
          git rm .github/workflows/horizon-rush-bgm-import.yml
          git commit -m "Install three verified HORIZON RUSH BGM MP3 tracks"
          git push origin HEAD:queue
