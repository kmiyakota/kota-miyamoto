<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>広告について｜好きからつくる。</title><style>body{max-width:760px;margin:auto;padding:28px 20px;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#3d3540;line-height:1.8;background:#fffafc}h1{font-size:1.7rem}h2{font-size:1.15rem;margin-top:2em}a{color:#9e4964}.note{background:#eef7f5;border:1px solid #cee7e2;border-radius:14px;padding:12px 14px}</style></head><body><h1>広告について</h1><p class="note">広告は工房の初期公開をゼロ経費に近づけるための候補です。創作途中の判断を邪魔しない配置を優先します。</p><h2>配置方針</h2><p>広告候補はホームとキャラ棚の末尾だけです。質問、人物設定、保存確認、編集ボタンの近くには置きません。</p><h2>広告と工房の回答</h2><p>広告は工房の提案や人物設定へ影響しません。広告主へキャラクターデータを送信する設計にはしません。</p><h2>現在の状態</h2><p>この準備版では、公開用の広告IDが未設定のため外部広告は表示しません。</p><p><a href="./">工房へ戻る</a></p></body></html>
